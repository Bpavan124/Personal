<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="240" height="240" rx="120" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <!-- Tech Grid Accent -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  
  <!-- Stylized Monogram / Tech Character -->
  <g transform="translate(120, 110)" text-anchor="middle" filter="url(#glow)">
    <circle cx="0" cy="0" r="64" fill="url(#avatarGrad)" />
    <!-- Developer Code Brackets & Initials -->
    <text x="0" y="16" font-family="'Segoe UI', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">BP</text>
  </g>
  <!-- Terminal Prompt Accent Badge -->
  <g transform="translate(165, 175)">
    <rect x="-12" y="-12" width="46" height="24" rx="12" fill="#10b981" stroke="#065f46" stroke-width="2" />
    <circle cx="2" cy="0" r="4" fill="#ffffff" />
    <text x="18" y="4" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">&gt;_</text>
  </g>
</svg>
